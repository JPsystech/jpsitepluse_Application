# Keep Gradle within the available native-memory budget on Windows.  A 2 GB
# heap together with Gradle's default worker count can exhaust native memory
# before Android compilation completes.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Xss512k -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.daemon=false
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
kotlin.incremental=false

